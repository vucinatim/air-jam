name: Diagnose npm publisher identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the production branch
        env:
          DIAGNOSTIC_REF: ${{ github.ref }}
        run: test "$DIAGNOSTIC_REF" = "refs/heads/codex/npm-publisher-diagnosis"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Inspect identity exchange without publishing
        run: |
          node --input-type=module <<'NODE'
          const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identityUrl.searchParams.set("audience", "npm:registry.npmjs.org");
          const identityResponse = await fetch(identityUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!identityResponse.ok) throw new Error(`GitHub identity request: ${identityResponse.status}`);
          const { value: identityToken } = await identityResponse.json();
          if (!identityToken) throw new Error("GitHub identity token missing");
          const claims = JSON.parse(Buffer.from(identityToken.split(".")[1], "base64url"));
          console.log(JSON.stringify({ repository: claims.repository, workflow_ref: claims.workflow_ref, ref: claims.ref, subject: claims.sub, audience: claims.aud }));
          for (const name of ["@air-jam/sdk", "@air-jam/devtools", "@air-jam/mcp-server", "@air-jam/cli", "@air-jam/server", "create-airjam"]) {
            const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, {
              method: "POST",
              headers: { Authorization: `Bearer ${identityToken}`, Accept: "application/json" },
            });
            const result = await response.json();
            const message = response.ok ? undefined : String(result.message ?? result.error ?? "No error message").replace(/eyJ[\w.-]+/g, "[redacted]").slice(0, 1000);
            console.log(JSON.stringify({ name, status: response.status, tokenReceived: Boolean(result.token), message }));
          }
          NODE
