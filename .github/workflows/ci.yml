name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static contracts
            history: 1
            command: >-
              pnpm --filter @air-jam/cli ai-pack:check &&
              pnpm lint &&
              pnpm guard:canonical
          - name: Type safety
            history: 1
            command: pnpm typecheck
          - name: Tests
            history: 0
            command: pnpm test
          - name: Workspace build
            history: 1
            command: pnpm build
          - name: Standalone packages
            history: 1
            command: >-
              mkdir -p .airjam &&
              pnpm --silent run repo -- pack verify-local --json > .airjam/foundation-package-proof.json
          - name: Performance smoke
            history: 1
            command: >-
              pnpm --filter server... build &&
              pnpm run repo -- perf sanity --profile ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tests inspect source history; other lanes need only this revision.
          fetch-depth: ${{ matrix.history }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Locate qualified foundation packages
        if: matrix.name == 'Standalone packages'
        id: foundation
        run: jq -r '"path=.airjam/tarballs/sets/\(.setId)"' .airjam/foundation-package-proof.json >> "$GITHUB_OUTPUT"

      - name: Retain qualified foundation packages
        if: matrix.name == 'Standalone packages'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-packages
          path: ${{ steps.foundation.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  checks:
    name: checks
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify every confidence lane
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "One or more CI confidence lanes did not pass: $VALIDATION_RESULT"
            exit 1
          fi
