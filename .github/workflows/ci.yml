name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static contracts
            history: 1
            command: >-
              pnpm --silent run repo -- platform generated check &&
              pnpm lint &&
              pnpm guard:canonical
          - name: Type safety
            history: 1
            command: pnpm typecheck
          - name: Tests
            history: 0
            command: pnpm test
          - name: Workspace build
            history: 1
            command: pnpm build
          - name: Standalone deployment
            history: 1
            command: pnpm check:platform:deploy
          - name: Performance smoke
            history: 1
            command: >-
              pnpm --filter server... build &&
              pnpm run repo -- perf sanity --profile ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Only the test lane resolves immutable readiness evidence.
          fetch-depth: ${{ matrix.history }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  checks:
    name: checks
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify every confidence lane
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "One or more CI confidence lanes did not pass: $VALIDATION_RESULT"
            exit 1
          fi
