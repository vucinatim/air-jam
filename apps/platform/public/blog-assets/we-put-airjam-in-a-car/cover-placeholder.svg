  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141b"/>
      <stop offset="0.55" stop-color="#101820"/>
      <stop offset="1" stop-color="#132c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#27d7e7" stop-opacity="0.32"/>
